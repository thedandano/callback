[project]
name = "callback"
version = "2.0.0"
description = "ATS-honest resume tailoring: a LangGraph MCP server that scores, tailors, and renders job applications"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.2.4",
    "jinja2>=3.1",
    "langgraph>=1.1.10",
    "langgraph-checkpoint-sqlite>=3.0.3",
    "langsmith>=0.8.0",
    "pdfplumber>=0.11.0",
    "pydantic>=2.13.3",
    "pyyaml>=6.0",
    "python-docx>=1.1.0",
    "typer>=0.15",
    "trafilatura>=2.2.0",
    "playwright>=1.62.0",
]

[project.scripts]
callback = "callback.cli:app"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["callback*"]

[tool.setuptools.package-data]
"callback.render" = ["*.html.j2", "fonts/*.ttf", "fonts/LICENSE.txt"]

[dependency-groups]
dev = [
    "import-linter>=2.17",
    "pre-commit>=4.0",
    "pyright>=1.1",
    "pytest>=9.0.3",
    "pytest-cov>=6.0",
    "pytest-mock>=3.14",
    "ruff>=0.8",
]

[tool.importlinter]
root_package = "callback"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Only the CLI may start the server"
type = "forbidden"
source_modules = ["callback"]
forbidden_modules = ["callback.server"]
ignore_imports = ["callback.cli -> callback.server"]

[[tool.importlinter.contracts]]
name = "Layered architecture"
type = "layers"
layers = [
    "callback.cli",
    "callback.server",
    "callback.tools",
    "callback.graphs",
    "callback.services | callback.render",
    "callback.repositories",
    "callback.config",
    "callback.models",
]

[[tool.importlinter.contracts]]
name = "Tools reach graphs only through their front doors"
type = "forbidden"
source_modules = ["callback.tools"]
forbidden_modules = [
    "callback.graphs.apply.graph",
    "callback.graphs.apply.nodes",
    "callback.graphs.profile.graph",
    "callback.graphs.profile.nodes",
    "langgraph",
]
# Only direct imports count: the front doors themselves import the graphs.
allow_indirect_imports = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 7

[tool.pytest.ini_options]
testpaths = ["tests", "evals"]
markers = [
    "integration: marks tests as integration",
    "local: marks tests that require local-only tools or filesystem paths",
]
filterwarnings = [
    "ignore:ast.Str is deprecated:DeprecationWarning:langsmith",
]
