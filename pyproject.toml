[project]
name = "callback"
version = "1.8.0"
description = "ATS-honest resume tailoring: a LangGraph MCP server that scores, tailors, and renders job applications"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.2.4",
    "jinja2>=3.1",
    "langgraph>=1.1.10",
    "langgraph-checkpoint-sqlite>=3.0.3",
    "langsmith>=0.8.0",
    "pdfplumber>=0.11.0",
    "pydantic>=2.13.3",
    "pyyaml>=6.0",
    "python-docx>=1.1.0",
    "typer>=0.15",
    "trafilatura>=2.2.0",
    "playwright>=1.62.0",
]

[project.scripts]
callback = "callback.cli:app"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["callback*"]

[tool.setuptools.package-data]
"callback.render" = ["*.html.j2", "fonts/*.ttf", "fonts/LICENSE.txt"]

[dependency-groups]
dev = [
    "import-linter>=2.17",
    "pre-commit>=4.0",
    "pyright>=1.1",
    "pytest>=9.0.3",
    "pytest-cov>=6.0",
    "pytest-mock>=3.14",
    "ruff>=0.8",
]

[tool.importlinter]
root_package = "callback"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Only the CLI may start the server"
type = "forbidden"
source_modules = ["callback"]
forbidden_modules = ["callback.server"]
ignore_imports = ["callback.cli -> callback.server"]

[[tool.importlinter.contracts]]
name = "config sits below everything but models"
type = "forbidden"
source_modules = ["callback.config"]
forbidden_modules = [
    "callback.server",
    "callback.cli",
    "callback.apply_graph",
    "callback.apply_nodes",
    "callback.extractor",
    "callback.jd_data",
    "callback.jd_fetcher",
    "callback.ledger_import",
    "callback.plugin_install",
    "callback.profile_graph",
    "callback.profile_nodes",
    "callback.profilecompiler",
    "callback.render",
    "callback.repositories",
    "callback.scorer",
    "callback.section_map",
    "callback.version_check",
    "callback.wikirenderer",
]

[[tool.importlinter.contracts]]
name = "models import nothing from the project"
type = "forbidden"
source_modules = ["callback.models"]
forbidden_modules = [
    "callback._build_info",
    "callback.server",
    "callback.cli",
    "callback.apply_graph",
    "callback.apply_nodes",
    "callback.config",
    "callback.extractor",
    "callback.jd_data",
    "callback.jd_fetcher",
    "callback.ledger_import",
    "callback.plugin_install",
    "callback.profile_graph",
    "callback.profile_nodes",
    "callback.profilecompiler",
    "callback.render",
    "callback.repositories",
    "callback.scorer",
    "callback.section_map",
    "callback.version_check",
    "callback.wikirenderer",
]

[[tool.importlinter.contracts]]
name = "repositories sit below services, render, graphs, tools, server and cli"
type = "forbidden"
source_modules = ["callback.repositories"]
forbidden_modules = [
    "callback.server",
    "callback.cli",
    "callback.apply_graph",
    "callback.apply_nodes",
    "callback.profile_graph",
    "callback.profile_nodes",
    "callback.scorer",
    "callback.extractor",
    "callback.jd_fetcher",
    "callback.profilecompiler",
    "callback.section_map",
    "callback.jd_data",
    "callback.wikirenderer",
    "callback.version_check",
    "callback.plugin_install",
    "callback.ledger_import",
    "callback.render",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 7

[tool.pytest.ini_options]
testpaths = ["tests", "evals"]
markers = [
    "integration: marks tests as integration",
    "local: marks tests that require local-only tools or filesystem paths",
]
filterwarnings = [
    "ignore:ast.Str is deprecated:DeprecationWarning:langsmith",
]
